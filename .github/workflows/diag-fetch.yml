name: Diag Fetch Case Klines

# 一次性诊断: 在 runner 上拉取指定标的 K 线并回传 artifact。
# 用途: 用户机器梯子未开, OKX 不通; runner 在 GitHub US IP 可直连 OKX。
# 触发后手动删除本文件 (或保留但仅 workflow_dispatch, 不影响 cron)。

on:
  workflow_dispatch:
    inputs:
      syms:
        description: '标的列表, 逗号分隔 (如 DOSUSDT,ABCUSDT)'
        required: false
        default: 'DOSUSDT'
      iv:
        description: '周期 (15m/1h/4h/1d)'
        required: false
        default: '4h'
      limit:
        description: 'K线根数'
        required: false
        default: '400'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch case klines
        run: |
          python - <<'EOF'
          import os, sys, csv
          sys.path.insert(0, "src")
          from market_data import OkxClient

          SYMS = "${{ github.event.inputs.syms }}".split(",")
          IV = "${{ github.event.inputs.iv }}"
          LIMIT = int("${{ github.event.inputs.limit }}")
          cli = OkxClient()
          assert cli.ping(), "OKX ping fail"
          for sym in SYMS:
              sym = sym.strip()
              path = os.path.join("data", f"klines_{IV}", sym, f"{sym}.csv")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              try:
                  ks = cli.get_klines(sym, IV, limit=LIMIT)
              except Exception as e:
                  print(f"  !! {sym} {IV} 异常: {e}")
                  continue
              print(f"  {sym} {IV}: {len(ks)}")
              with open(path, "w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f)
                  for k in ks:
                      w.writerow([k.openTime, k.open, k.high, k.low, k.close,
                                  k.volume, k.closeTime, k.quoteVolume])
          EOF

      - name: Upload klines
        uses: actions/upload-artifact@v4
        with:
          name: case-klines
          path: data/klines_*/
          retention-days: 3
