name: Eval Demoted

# 降级规则实战复盘：被降级(头肩顶/15m逆势)的信号, 之后的走势是否真的
# 比正式推送的差? 用真实K线回答 (本机无梯子, 只能在云端拉 OKX 数据)。
#
# 触发：git push origin eval-<任意>  (本机无 gh / 无 PAT, 只能靠 tag)

on:
  push:
    tags:
      - 'eval-*'
  workflow_dispatch:

concurrency:
  group: eval-demoted
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "UTC"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run eval
        run: |
          mkdir -p eval
          # 2026-09-28: --days 由 2 提到 14。原设置是覆盖式快照只评最近 2 天,
          # 中间日期的信号永远进不了复盘, 与"攒够样本再判降级规则"的目标矛盾。
          # state 里 observed/pushedSignals 本身有裁剪上限, 14 天窗口足够覆盖全量。
          python tools/eval_demoted.py \
            --state state/state.json --days 14 \
            --out eval/demoted_report.json

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval || true
          if git diff --cached --quiet; then
            echo "无结果文件"
          else
            git commit -m "chore: eval demoted result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 带重试的推送（与 backtest.yml 同款）：2026-09-20 踩坑——与扫描/渲染
            # 任务同时 push 被拒, 失败被 || echo 吞掉, 步骤假装成功但结果丢失。
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              echo "push 撞车，20s 后重试($i/5)"
              sleep 20
            done
            echo "推送失败，artifact 仍有副本"
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-demoted-${{ github.run_id }}
          path: eval
          retention-days: 14
