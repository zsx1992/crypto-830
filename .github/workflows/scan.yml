name: Crypto Pattern Scanner

# 定时触发 + 手动触发
on:
  schedule:
    # 每小时三个触发点(:05/:25/:45)
    #
    # 【实测教训 2026-08-30】单个 cron 在高峰期可能被 GitHub 跳过
    # （连续5小时没触发），于是改成两个错开的触发点做冗余。
    #
    # 【实测教训 2026-08-31】双触发(:05/:35)【仍然会被跳过】——
    # 15:35 和 16:05 连跳两次，最后靠手动 workflow_dispatch 补跑才验证上新代码。
    # GitHub 的 schedule 是"尽力而为"，不保证每次都触发，只能靠加密触发点提高命中率。
    #
    # 因此加到三个点（间隔20分钟）。若多个都响：concurrency 排队依次执行
    # （单次约7分钟，间隔20分钟，不会堆积）；后一次因冷却期去重基本不会重复推送，
    # 但会发摘要确认存活。
    #
    # 代价：运行次数 ×1.5（约72次/天）。公开仓库 Actions 分钟数免费无限，可接受。
    # 若哪天把仓库改回私有，这里必须同步调回，否则 2000分钟/月 撑不过 3 天。
    #
    # 注意：cron 为 UTC 时间（分钟数与北京时间相同，+8 只影响小时位）。
    - cron: '5 * * * *'
    - cron: '25 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      top_n:
        description: '扫描前 N 个标的（留空用配置文件的 300）'
        required: false
        type: string
      dry_run:
        description: '干跑模式（不发送消息）'
        required: false
        default: false
        type: boolean

# 防止同一 job 重叠运行。
# cancel-in-progress 设为 false：正在跑的扫描不该被新触发取消，
# 否则会丢失本轮信号。
concurrency:
  group: crypto-pattern-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "UTC"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # TA-Lib 有预编译 wheel；万一装不上代码会自动降级为内置numpy实现，不影响运行
          #
          # tzdata: IANA 时区数据，推送消息上的"北京时间"依赖它。
          # ubuntu 镜像自带系统 tzdata，zoneinfo 本来就能用；这里显式装一份，
          # 防止将来 runner 镜像精简掉 /usr/share/zoneinfo 导致时间静默回退成 UTC。
          # 注意：本文件没有用 requirements.txt，改依赖时两处要同步。
          pip install requests pyyaml matplotlib numpy TA-Lib tzdata || \
            pip install requests pyyaml matplotlib numpy tzdata

      # 去重状态：cache 为主，git 文件为兜底
      # cache 会被 Actions 清理（保留政策/容量上限），
      # 所以下面还有一步 git commit 回写做永久备份
      - name: Restore dedup state
        id: state-cache
        uses: actions/cache@v4
        with:
          path: state/
          key: pattern-state-${{ github.run_id }}
          restore-keys: |
            pattern-state-

      # 验证 webhook 连通性 — 在扫描前先发一条测试消息。
      # 如果扫描后没收到任何消息但这条收到了 → 问题是扫描器
      # 如果这条也没收到 → 问题是 Secret 或 webhook URL
      - name: Test WeCom webhook
        if: env.WECOM_WEBHOOK != ''
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          if [ -z "$WECOM_WEBHOOK" ]; then
            echo "❌ WECOM_WEBHOOK Secret 未配置或为空"
            exit 0
          fi
          # 脱敏打印（保留前8字符+后4字符）
          SAFE=$(echo "$WECOM_WEBHOOK" | sed -E 's|(.{20}).+(.{8})|\1***\2|')
          echo "Webhook (脱敏): $SAFE"
          PAYLOAD='{"msgtype":"markdown","markdown":{"content":"🧪 Webhook 测试\n> 来源: GitHub Actions\n> 若你看到这条,说明 Secret → env → 企微 整条链路通了"}}'
          HTTP_CODE=$(curl -s -o /tmp/wecom_test_resp.json -w "%{http_code}" \
                       -H "Content-Type: application/json" \
                       -X POST \
                       -d "$PAYLOAD" \
                       "$WECOM_WEBHOOK")
          RESP=$(cat /tmp/wecom_test_resp.json)
          echo "HTTP: $HTTP_CODE  Body: $RESP"
          ERRCODE=$(echo "$RESP" | python -c "import sys,json;print(json.load(sys.stdin).get('errcode','?'))" 2>/dev/null || echo "?")
          if [ "$ERRCODE" = "0" ]; then
            echo "✅ 测试消息发送成功，请在企微群确认收到"
          else
            echo "❌ 测试消息发送失败 (errcode=$ERRCODE)，请检查 Secret 值是否完整正确"
          fi

      - name: Run scanner
        env:
          # Webhook 地址存在 Secrets 里，不出现在此文件的明文里
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          ARGS="--config config.yaml --full"
          if [ -n "${{ github.event.inputs.top_n }}" ]; then
            ARGS="$ARGS --top-n ${{ github.event.inputs.top_n }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "运行参数: $ARGS"
          python main.py $ARGS

      - name: Persist state to repo (cache 的兜底)
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@scanner.local"
          git add state/ || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update scan state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || echo "推送失败（可能是并发冲突），不影响本次扫描"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            output/
            state/state.json
          retention-days: 7
