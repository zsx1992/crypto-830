# ============================================================
#  加密货币合约图表形态扫描器 - 完整配置文件
#  用法: python main.py --config config.yaml
#  所有阈值均可在此调整，代码中无硬编码
# ============================================================

# === 数据源配置 ===
#
# 【重要】GitHub Actions 的服务器在美国，Binance 会返回 HTTP 451 拒绝服务
# （地理屏蔽，2026-08-30 实测确认）。因此 Actions 上必须用 OKX 作主源。
# 你本机（中国 IP）想用回 Binance，改 primary: "binance" 即可。
data_source:
  primary: "okx"                   # 主数据源: binance / okx
  fallback: "binance"              # 兜底数据源
  base_url_binance: "https://fapi.binance.com/fapi/v1"
  base_url_okx: "https://www.okx.com/api/v5/market"
  timeout_seconds: 30              # HTTP 超时
  retry_max: 3                     # 最大重试次数
  retry_backoff_base: 2.0          # 指数退避基数(秒)
  ticker_cache_hours: 6            # ticker 数据缓存时间(小时)

# === 扫描目标 ===
scan:
  top_n: 300                      # 按24h成交额取前N个合约
  min_volume_usdt: 5000000         # 最低24h成交额过滤(500万USDT)
  intervals:                       # 扫描周期列表
    - "15m"
    - "1h"
    - "4h"
    - "1d"

  # --- S3 分层标的池 (2026-09-07) ---
  # 动机：近端检测盲区 + 市场事实导致"新鲜形态"供给天然稀缺（0~1 张/轮），
  # 与其放宽 freshness 推陈年信号，不如扩长尾标的的大周期供给。
  # 分层：core(≥core 门槛) 全周期扫；tail(尾池区间) 只扫大周期——大周期抗噪，
  # 低流动性小周期插针噪声大故排除。core/tail 按成交额区间划分无交集。
  tail_enabled: true              # 长尾池开关（false = 行为与 S3 前完全一致）
  tail_top_n: 300                 # 长尾池最多取多少个
  tail_min_volume_usdt: 1000000   # 长尾池成交额下限(100万USDT)；上限=core 的 min_volume_usdt
  tail_intervals:                 # 长尾池只扫这些周期
    - "4h"
    - "1d"

  # 各周期需要的K线根数
  # 2026-09-02 调整：按"TV 大图习惯"统一加大背景，让图上可见几百根K线。
  # 15m 600根≈6天, 1h 400根≈17天, 4h 300根≈50天, 1d 240根≈240天。
  # OKX 单次最多返300根，1h/4h/1d 需2次请求拼接（代码已支持分页）。
  kline_counts:
    "15m": 600                    # ~6天
    "1h": 400                     # ~17天
    "4h": 300                     # ~50天
    "1d": 240                     # ~240天

# === 并发与限流 ===
throttling:
  concurrency: 3                   # 并发HTTP请求数
  request_interval_ms: 100         # 请求间最小间隔(毫秒)
  batch_size: 50                  # 每批处理的标的数
  batch_pause_sec: 2               # 批间暂停(秒)
  weight_safety_margin: 100        # Binance weight 预留余量

# === ZigZag 摆动点检测参数 ===
# 实测标定（Top8 标的中位数）：摆动点密度落在 0.04~0.18 为健康区间
#   周期   参数    K线数  摆动点   密度     判定
#   15m   (5,5)   600    63      0.105   healthy
#   1h    (5,5)   400    38      0.095   healthy
#   4h    (3,3)   300    45      0.150   healthy
#   1d    (3,3)   240    36      0.150   healthy
#   1d    (2,2)   240    56      0.233   sensitive ← 噪声过多，已弃用
zigzag:
  # 按周期分别配置 left/right 窗口
  # 值越小越灵敏但噪声越多; 天然滞后 = right 根K线
  "15m":
    left: 5
    right: 5
  "1h":
    left: 5
    right: 5
  "4h":
    left: 3
    right: 3
  "1d":
    left: 3                       # 原为2，实测密度0.233过噪，上调至3
    right: 3

  # 多尺度扫描：在这些 left/right 窗口上各跑一遍检测再合并结果
  #
  # 实测（82个标注样本，判定窗口≤25根K线）：
  #   单尺度(5,5)   精确类型命中率  8.5%
  #   多尺度[3,5,8,12]          15.9%   ← 接近翻倍
  # 原因：人眼看图会自动做视觉平滑，固定尺度必然与人的视角错位。
  # 代价：计算量 ×4，且候选形态变多，需要靠去重和过滤收敛。
  multiscale: [3, 5, 8, 12]

  # 摆幅显著性门槛（P3，对应 TV 指标的"噪声摆动点"剔除）
  # 一个摆动点相对前一反向点的价格变化 < 该倍数 × ATR 时视为噪声锯齿丢弃。
  # 1.0 = 只砍 <1×ATR 的微型摆动，真实形态摆动（双底两谷差≈1~3×ATR）不受影响。
  # 这是"画的太不准"的根因修复——噪声点被连成伪头肩/伪三角。
  swing_min_atr: 1.0

# === 形态识别阈值 ===
patterns:

  # --- 价格容差 ---
  tolerance:
    # 头肩 两肩价差容差。
    # 【2026-09-10 收紧 0.08 -> 0.05, 用户金标准 AXTIUSDT 4h H&S底"不标准"】
    #   原 0.08 比 validate_geometry 肩对归零容差(0.05)宽 3 点 —— 与 MINIMAX
    #   颈线同构的"确认线>评分线"错位。AXTI 两肩 56.24 vs 60.10 差 6.9%,
    #   确认通过但几何肩对=0.00, 图上右肩明显抬高、形态不对称。
    #   收紧到 0.05 与几何归零线对齐。全池 A/B (58->28 里的肩差因子):
    #   消失案例里肩差>5% 的多为头很深但肩不齐(DRAM 头突15%)或本就弱结构。
    peak_price: 0.05
    double_top_bottom_price: 0.03 # [近距基准] 双顶/双底 两峰/两谷价差容差
    # 2026-09-01: 0.05(原更宽收严到5%), 标注 4 张双底 2 张两谷差 12%/7% 全误报。
    # 2026-09-07: 0.05→0.03 (A+B 组合)。SOPHUSDT 4h age=1 双底 geo=0.001 根因:
    #   确认容差 5% 与几何价对分归零容差 5%(base.py 写死)重合——价差 4.99% 的形态
    #   "确认时算双底、打分时算完全不像"。收严确认到 3%, 让 4~5% 略歪形态不进管线,
    #   与几何归零线(放宽到 10%)分层, 确认线内打分才有梯度。
    # 2026-09-08 (C方案 边界灵活): 上述 3% 只适用于近距小形态。大 W 底两谷价差
    #   天然大 (PIEVERSE 真实谷差 7.2% / ENAUSDT 7.4% = higher-low 结构非噪声),
    #   固定 3% 会把大形态全拒。容差改为随跨度缩放:
    #     span <= double_top_tol_span_lo(50根)  → double_top_tol_min (3% 严)
    #     span >= double_top_tol_span_hi(200根) → double_top_tol_max (5% 宽)
    #     中间线性过渡。cap 5%: 7%+ 谷差仍判为 higher-low 趋势而非标准双底。
    double_top_tol_min: 0.03      # 近距小形态容差 (与 double_top_bottom_price 同值)
    double_top_tol_max: 0.05      # 大跨度形态容差上限 (cap)
    double_top_tol_span_lo: 50    # 跨度 <= 此根数用 tol_min
    double_top_tol_span_hi: 200   # 跨度 >= 此根数用 tol_max
    # 方向性硬闸 (2026-09-09, 用户金标准 CBRS 1h / RAY 1d / BNB):
    #   双顶右峰最多比左峰高 2% (更高=higher-high 趋势延续, 非 M 顶失败;
    #     CBRS 右顶高 2.54% 用户判"明显不是双顶")
    #   双底右谷最多比左谷低 3% (更低=lower-low 下跌延续, 非 W 底;
    #     RAY 右谷低 1.95% 是真信号须放行 / BNB 低 5.7% 用户判"非教科书W底")
    # 与上面的 |价差| 容差正交。
    double_peak_overshoot_max: 0.02
    double_trough_undershoot_max: 0.03
    shoulder_ratio: 0.03          # 双顶/双底 中间谷/峰最小深度（原0.05）
    # 头肩 两谷/两峰高度差（确认容差上限）。
    # 【2026-09-09 收紧 0.08 -> 0.05, 用户金标准 MINIMAX 15m H&S底"瞎画"】
    #   原 0.08 比 validate_geometry 颈平归零容差(0.05)还宽 3 个点 →
    #   "确认了但画出来颈平 0 分"的怪形态。MINIMAX 两颈峰 46.16 vs 42.51
    #   差 7.9%, 颈线明显右倾塌陷, 用户判"什么也不是简直瞎画"。
    #   收紧到 0.05 与几何归零线对齐(确认 = 评分非零), 形态确认后颈平不再归零。
    #   全池审计(69 个 H&S): >8% 区间 0 个(8% 上沿从未被用到), 5~8% 区间
    #   9 个(7 个 CANDIDATE 未突破 + SOL/ENA 1h H&S顶 CONFIRMED 未获认可)。
    neck_slope_max: 0.05
    # 头肩 头部突出度下限。
    # 【2026-09-10 收紧 0.01 -> 0.03, 用户金标准 ALLO 1h / SUI 1h "不标准"】
    #   原 0.01 太松: ALLO 三峰 0.2516/0.2555/0.2505 几乎等高(头突仅1.55%),
    #   SUI 右肩距头仅 1.25% (右肩未衰竭) —— 都擦线确认、图上"没有头"。
    #   几何头突理想值 10%(5~15%), 3% 时打分 0.3/1.0 仍有梯度。RKLB(用户认可)
    #   头突 4.7% > 3% 不受影响。全池 A/B: 头突<3% 的弱头形态全部退出确认池。
    head_prominence: 0.03
    touch_penetration: 0.02        # 趋势线触点最大穿透容差 (2%)
    triple_peak_diff: 0.05        # 三重顶/底 三峰间最大价差 (5%)

  # --- 形态自身跨度下限 (第一拐点到最后一拐点) ---
  # 【2026-09-02 校准】基于 60 张标注样本(7 像 / 49 不像 / 4 拿不准):
  #   接受的 OK 样本跨度: min=20, med=63, max=140
  #   误报 BAD 样本跨度: min=16, med=34, max=160 (且 73% 集中在 16~46 根)
  #   重灾区(双底 18/49、上升楔形 13/49、头肩顶 6/49、双顶 5/49)
  #   置信度没用: 49 张坏里有 22 张置信 ≥0.8
  # 决策：4h 最小跨度 40 根(≈6.7天)，把"10多根K线说头肩/三角"的速成形态
  #       全部拦掉；其他周期按比例。
  # 副作用：4h < 40 根的合理形态也会被滤(预计损失 < 10%)，换来误报显著减少。
  min_pattern_bars:
    "15m": 60                       # ~15小时
    "1h": 35                        # ~35小时
    "4h": 40                        # ~6.7天
    "1d": 30                        # ~30天

  # --- 形态跨度限制 (K线根数) ---
  span:
    # 【2026-09-08 朱哥金标准反馈校准】两谷/两峰最大间距从 150 放宽到 350：
    #   PIEVERSE 1h 大 W 底 (底①08-25 0.94 / 底②09-01 0.99) 两谷相距 ~168 根，
    #   超旧上限 150 被检测器直接拒绝 → 只推送了右侧 ~1.005 的局部小 W 底，
    #   而真正的大 W 底 (颈 1.15, 突破后冲到 1.32) 才是主信号。
    #   350 ≈ 14.6 天 @1h，可容纳 2-3 周大形态；1d 周期 350 天同理（K线池内自然截断）。
    double_top_min: 30             # 双顶/双底 两峰/两谷最小间距（原8，提至30 拦掉速成）
    double_top_max: 350            # 双顶两峰最大间距（原150，放宽容纳大 W 底）
    # 【2026-09-08 同步放宽】大 H&S 同理可能跨 2-3 周 (220 根@1h ≈ 9 天不够)。
    #   注意：放宽后老突破变多，最终由 freshness + require_intact_breakout 兜底。
    head_shoulders_min: 35         # 头肩形态最小跨度（原15，提至35）
    head_shoulders_max: 420        # 头肩形态最大跨度（原220，放宽容纳大 H&S）
    triangle_min_touches: 4        # 三角形最少触点数
    triangle_min_span: 25          # 三角形最小跨度（原12，提至25）
    triangle_max_span: 160         # 三角形最大跨度
    triangle_min_height_atr: 1.0   # 三角形最小高度ATR倍数
    # 【2026-09-09 价格包住硬校验, 用户金标准 DOSUSDT 4h 误判】
    #   DOS 被画成 descending_triangle 推送, 用户判"中间涨那么多、一堆 K 线
    #   在画的线之外且不是插针, 完全不是三角"。量化: 上边界窗口 144 根里
    #   收盘越界 20.1% / 深刺(>2%) 18.1% / 最大穿透 28.6% —— 触点校验只保证
    #   边界上有 >=2 个摆动点贴线, 从不保证中间行情被框住。box 已有同款闸
    #   (BNB/CL/LAYER), triangle 漏加, 现补上 (共享 base.containment_ok):
    triangle_contain_max_penetration: 0.08    # 单根影线相对边界最大穿透 (8%)
    triangle_contain_max_close_escape: 0.15   # 收盘跑出边界外的K线占比上限 (15%)
    triangle_contain_max_deep_escape: 0.15    # 影线深刺(>2%)的占比上限 (15%)
    # 2026-09-08 修复: flag_pole_min_bars 曾被误当作 "pole_max_bars" 传入检测器,
    # 等于要求旗杆 3 根内涨完 (真实旗杆如 BTC 4h 08-19 那根用了 9 根) → 全线漏检。
    # 检测器实际不使用 min_bars, 保留仅为说明; 生效的是下面的 max_bars。
    flag_pole_min_bars: 3          # [未接线] 旗杆最少K线数
    flag_pole_max_bars: 15         # 旗杆最多用多少根K线完成 (新增, 修复漏检)
    flag_pole_min_move: 0.03       # 旗杆最小涨幅/跌幅 (3%)
    flag_body_min: 5               # 旗身最少K线数
    flag_body_max: 60              # 旗身最多K线数 (原 25: 在 1h 上仅 1 天,
                                   #  教科书旗形整理 1~3 天根本装不下)
    wedge_min_touches: 5           # 楔形最少触点数
    wedge_min_span: 30             # 楔形最小跨度（原15，提至30）
    wedge_max_span: 150            # 楔形最大跨度
    wedge_min_height_atr: 2.0      # 楔形最小高度ATR倍数
    rectangle_min_height_atr: 3.0   # 箱体最小高度(ATR倍数)

    # --- 箱体/通道 (2026-09-08 B阶段补充, BoxDetector) ---
    # 填补空白: 三角形要求收敛、楔形要求收敛+5触点, 水平箱体与斜平行
    # 通道此前没有任何检测器认领。rectangle_min_height_atr 上面已有。
    rectangle_min_touches: 2       # 每条边界最少触点 (合计>=4)
    rectangle_min_span: 30         # 箱体最小跨度 (与 wedge_min_span 同数量级)
    rectangle_max_span: 200        # 箱体最大跨度
    box_flat_threshold: 0.0004     # 箱体判定: 边界 |rel_slope| <= 此值 (每根K线相对变化0.04%)
    box_max_slope_diff: 0.0008     # 平行判定: |上斜率-下斜率| <= 此值
    # 【2026-09-09 宽度收窄硬闸, 用户金标准 ZBT 4h】
    # 平行判定盲区: 斜率差小但一缓一陡 → 右端显著收窄(收敛三角/楔形)。
    # ZBT 实测 slope_diff=0.000475 过闸但收窄比仅 0.44, 用户判"上升三角"。
    # 真通道两端近等宽, 右端 < 左端×0.75 = 收敛形态, box 让路给 triangle。
    box_min_width_ratio: 0.75
    # 【2026-09-09 价格包住硬校验 + 边界同步, 用户金标准 BNB/CL/LAYER 案例】
    # 用户点评"瞎画"的根因: ① 边界只连孤立点, 中间价格完全跑飞(穿透大);
    # ② 上/下边界起点错位, 窗口并集前段只有单边"悬空"(BNB U从63起/L从25起,
    #    CL L从93起/U从131起)。三道硬闸 + 重叠收紧, 任一超限直接拒:
    box_overlap_min: 0.85          # 两边界时间重叠 ≥ 短边跨度的 85% (原0.5)
    box_contain_max_penetration: 0.08    # 单根影线相对边界最大穿透 (8%)
    box_contain_max_close_escape: 0.15   # 收盘跑出边界外的K线占比上限 (15%)
    box_contain_max_deep_escape: 0.15    # 影线深刺(>2%)的占比上限 (15%)

  # --- 突破确认 ---
  confirmation:
    breakout_candles: 2            # 连续几根收盘在边界外才算确认
    max_check_candles: 5           # 最多往前看几根(超过则标记为未确认非失败)
    breakout_atr_ratio: 0.5        # 突破最小幅度 (ATR倍数)
    volume_ratio_min: 1.5          # 突破K线量 / 近20根均量 最小比值

  # --- 交易价位 ---
  # 【回测实测 2026-09-01】49标的×2100根4h, 33笔（见 docs/05-delivery.md D.6）：
  #   tp1_ratio=1.0 → -0.09R (胜率30%)   0.75 → +0.26R (39%)   0.5 → +0.56R (48.5%)
  # 1×形态高度的目标太远，经常先回踩打止损；0.5x 更早落袋，期望由负转正。
  # 保守可选 0.6 折中。
  trade_levels:
    tp1_ratio: 0.5                 # 止盈1 = 形态高度 × 0.5（原1.0）
    tp2_ratio: 1.618               # 止盈2 = 形态高度 × 1.618（斐波那契扩展）
    atr_stop_multiplier: 1.5       # 止损 = 颈线外侧 1.5×ATR

# === 信号过滤 ===
filter:
  # 【2026-09-08 放宽 60→55】连放 freshness 后, 仅存的几个"新鲜+几何干净"
  # 信号(如 BTC 1d 头肩底 strength=58)卡在 60 下被砍; 58 与 60 差异无实
  # 质区分, 且这些已是"新鲜+确认+突破有效"的真信号, 降到 55 放行边界案例。
  min_strength: 55                 # 最低推送分数 (0~100)
  # 最小风险回报比。
  # 【联动调整 2026-09-01】tp1_ratio 从 1.0 改为 0.5 后，RR 口径减半
  # （reward = 0.5×形态高度），故 1.5 → 0.75，等效原口径 RR≥1.5，与回测一致。
  # 【2026-09-08 放宽 0.75→0.5】0.75 等价于要求形态高度 ≥2.25×ATR, 把很多
  # 真实但偏浅的形态(尤其低波动大盘币)全砍——本轮 PNUT 1d 双底(strength84
  # geo0.87 仅 rr0.66)、SUSHI 4h 双底(量能52×仅 rr0.687)均因此误杀。
  # 降到 0.5(高度≥1.5×ATR)放行浅但干净的真实突破, 召回优先; 用户人眼标注
  # 兜虚假阳性。STRK 4h(geo0.28/strength47)仍被几何/强度闸拦下, 不会泛滥。
  min_rr: 0.5                      # 最小风险回报比（0.5x止盈下等效原1.5）
  max_per_run: 20                 # 单次run最多推送条数
  min_confidence: 0.6             # 最低几何置信度 (0~1)
  # 按周期分级覆盖（1d 单独更严）：1d 实测误报率 75%（2026-09-01），
  # 全局 0.6 之外再抬一档。不在表里的周期用全局 min_confidence。
  min_confidence_by_interval:
    "1d": 0.65
  min_volume_ratio: 1.5           # 最低量能比

  # 几何质量分硬闸门 (0~1)。
  # 【2026-09-05 首次加入, 设 0.6】209 张标注模拟精确率 16.7%→25.6%。
  # 【2026-09-07 放宽到 0.5】9-05 落地后 476 候选→0 推送(47个也全被砍)，
  # 9:30 摘要暴露"确认→过滤后"100% 杀光, 主嫌几何闸过严。临时放宽验证,
  # 若 9:45 那轮出图说明几何闸是主因; 若仍 0 则是其他闸。挂机观察。
  # 【2026-09-08 放宽 0.5→0.45】BTC 1d 头肩底 geo=0.451 卡线被砍, 与 0.5
  # 无实质区分; 放到 0.45 放行边界干净案例(STRK geo0.28 仍拦下)。
  min_geometry: 0.45

  # 同一标的最多推几条 + 方向冲突时以最大周期为准
  #
  # 实测问题：XRPUSDT 一次扫描报了 4 条(15m头肩顶空、1h头肩顶空、
  # 4h双底多、1d双底多)，同一标的既让多又让空，使用者无所适从。
  # 消解规则：方向冲突时以【最大周期】为准（大周期代表更大格局），
  #           然后每个标的最多保留 max_per_symbol 条。
  max_per_symbol: 2

  # 趋势过滤：信号方向必须与当前周期趋势同向才推送
  #
  # 【2026-09-03 重新打开】原先 2026-08-30 实测"开/关差异在噪声内、只滤2个，
  # 因当时周期EMA过滤太弱"而默认关闭。现已引入 ADX/RSI/MACD 共振门
  # （indicators.py + crosstf.score_trend_consistency），趋势维度不再靠裸EMA：
  #   - 趋势对齐只在 ADX >= trend_adx_threshold 时强制（横盘不杀）
  #   - 评分里 RSI/MACD 与方向同向才加分（多源同意才信，对应 fantomluck）
  # 因此重新打开，借 ADX 把"逆势但几何干净"的误报挡在推送门外。
  # LONG 信号 需 trend == up; SHORT 信号 需 trend == down
  require_trend_alignment: true

  # 趋势对齐的 ADX 门槛：低于此值视为横盘，不强制方向对齐（避免误杀区间反转）
  trend_adx_threshold: 20

  # 噪音过滤
  min_volatility: 0.005            # ATR/Price 低于此视为横盘 (0.5%)
  max_candle_range: 0.08           # 单根K线振幅超此视为插针 (8%)
  min_recent_volume_ratio: 0.3     # 最新一根量/前19均量 最低比值

  # 冷却期 (分钟) — 同一(symbol, patternType, interval) 不重复推
  cooldown_minutes:
    "15m": 30
    "1h": 120
    "4h": 480
    "1d": 1440

  # 突破必须"仍然有效"才推送（拦截假突破）
  #
  # 实测案例：GIGGLEUSDT 4h 上升三角形在 #115 以 44.81 突破上边界，
  # 当时满足全部条件（幅度2.97×ATR、量能9.33×、连确认5根），
  # 但最新一根价格已跌回 40.17，跌破入场价——典型的假突破。
  # 开启后，最新收盘价若已回到边界的错误一侧，状态标记为 FAILED 不推送。
  require_intact_breakout: true

  # 双顶/双底：突破后回踩确认窗口（2026-09-01 实测发现 XAG 4h 双顶
  # 靠单根长上影 close 跌破颈线就判确认，XAG 标"不像"是误报）。
  # 开启后，突破确认通过后若 N 根 K 线内收盘价回到颈线错误一侧
  # （SHORT: close > neck；LONG: close < neck），视为假突破不推送。
  # 0 表示关闭。默认 3 根（约 12 小时 @ 4h 周期）。
  double_pullback_bars: 3

  # 新鲜度窗口 (K线根数) — 突破点距今超过这个数就不推送
  #
  # 【实测发现的严重问题】不加这个约束时，所有"已确认信号"的突破点
  # 距今 63~164 根K线（1h周期即 2.6~6.8天前），推送的全是过期信号。
  # 检测器扫描整段历史，必然找到早已完成的形态。
  #
  # 取值逻辑：要能覆盖 GitHub Actions cron 的调度延迟（实测可达15分钟），
  # 又不能太宽以至于推送时入场位已经走掉。
  #
  # 【实测标定】第一版设成 15m=8/1h=6/4h=4/1d=3，结果一个信号都出不来。
  # 原因：ZigZag 的 right 窗口 + 突破需连续2根确认，天然存在 age 下限。
  # 实测各周期已确认信号的最小 age：
  #   15m: 5根    1h: 19根    4h: 4根    1d: 9根
  # 所以 1h=6 和 1d=3 是【永远不可能满足】的死配置。
  #
  # 按实测分位数重设（40标的×4周期=160次扫描的统计）：
  #   15m=12根(3小时)  → 约 6% 通过
  #   1h =20根(20小时) → 约 17% 通过
  #   4h =12根(2天)    → 约 44% 通过
  #   1d =12根(12天)   → 约 73% 通过（日线形态稀少，放宽合理）
  #
  # 【2026-09-07 B1 放宽 15m/1h】11:29 摘要 kill_breakdown 实测:
  #   freshness 砍 43/47 (93.5%)，是第一道闸先砍死，后续闸
  #   (volume/geometry/trend) 全 0 杀闲置。且 1h 天然最小 age=19 根，
  #   窗口 20 意味着幸存窗口仅 19~20 两根宽——能否推送取决于运气。
  #   故放宽: 15m 12→20 (5h)、1h 20→30 (30h)，让管道恢复流量、
  #   各闸重新参与筛选。4h/1d 通过率本就高(44%/73%)不动。
  #   注意: 放宽会混入"突破已 1~1.5 天"的较老信号，人眼验证时看 age。
  # 【2026-09-08 重新标定 —— 这是"几天 0 推送"的根因】
  # 实测本轮(126标的×4周期)24个已确认突破的年龄分布:
  #   15m min=98(≈1天, 全陈旧)   1h min=210(≈9天, 全陈旧)
  #   4h  min=16(≈2.7天)         1d min=19(≈19天)
  # 旧窗口 12/30/12/20 把"仅有的新鲜突破"也误杀(4h 2.7天>2天窗口、
  # 1d 19天>12天窗口), 且后续5道闸(freshness 杀光后)形同虚设, 全链路 0 推送。
  # 重新标定原则: 窗口 = 该周期"自然新鲜突破最小年龄" + 余量,
  # 既能放行最新鲜的一批, 又不推 9 天前的陈旧突破(1h 那批 200+ 根远超窗口仍被拦)。
  #   4h 窗 12→24 (≈4天: 放行 age≤24 的 4h 突破, 含本轮最新鲜的 16/22)
  #   1d 窗 12→22 (≈22天: 放行 age≤22 的日线突破, 含本轮 19; 27/39 仍砍)
  #   1h 窗 30→48 (≈2天: 本轮1h全陈旧210+ 不推; 市场出现新鲜1h突破~age19时放行)
  #   15m 窗 20→30 (≈7.5h: 本轮15m全陈旧98 不推; 出现新鲜15m突破~age5时放行)
  # 注: 放宽后推送频率仍受"市场是否真有新鲜突破"约束——无新鲜突破的时段
  #     本就该 0 推送(而非硬推陈旧信号), 这与设计一致。
  freshness_bars:
    "15m": 30      # ~7.5h（原20 → 2026-09-08 重新标定）
    "1h": 48       # ~2天（原30）
    "4h": 24       # ~4天（原12）
    "1d": 22       # ~22天（原12）
  freshness_default: 24

  # === 观察流 (2026-09-08) ===
  # 连续 10+ 轮 0 推送(市场无"新鲜+标准+RR"三重合格形态) → 金标准样本停滞,
  # 回测主线被饿死。观察流把"穿过 freshness 但被后续闸砍"的新鲜信号
  # (差一口气的边界样本) 单独推送, 标记【观察】供人眼验证/攒金标准样本。
  # 设计要点:
  #   - 只收穿 freshness 的(新鲜突破), 不收老突破(数量巨大且无时效价值)
  #   - 独立去重空间(observedSignals), 观察过的形态达标后仍可正式推送
  #   - 正式推送线完全不受影响; enabled=false 时行为与旧版一致
  #   - 结构下限: 太歪的(strength<45 或 geo<0.30)不打扰, 聚焦"接近推送线"
  #     的边界样本——金标准标注最有信息量的正是边界案例
  #   - 2026-09-07 实测校准: ENA geo0.429 进观察(边界), IOTA geo0.128 不进(太歪)
  observe:
    enabled: true
    max_per_run: 5        # 每轮最多观察推送几张 (markdown+image=2条/张)
    min_strength: 45      # 结构下限: 强度分 0~100
    min_geometry: 0.30    # 结构下限: 几何分 0~1 (None 视为达标=兜底0.5语义)

  # === 去重：状态跃迁可重推 (2026-09-10 P2) ===
  # 旧逻辑：同一(symbol,patternType,interval) 结构未变时永久抑制(每形态一生只推1次)，
  # 是"安静期0推送"主因之一。改为：形态发生"状态跃迁/新事件"时允许重推，
  # 每个事件都有信息量(新突破腿/强度跳升/突破价位移)，既不把同一形态刷屏，
  # 也不再把静态形态永久闷死。
  #   reconfirm_cooldown_hours=0 时只靠事件重推(安全, 不会刷屏)；
  #   设为>0 开启"形态仍在"周期重报(每N小时重推一次)，有刷屏风险，慎开。
  dedup:
    event_repush: true            # 允许状态跃迁重推(核心开关)
    event_breakout_advance: 2     # 突破又延伸≥2根 → 算新事件
    event_strength_delta: 8       # 强度提升≥8分 → 算新事件
    event_price_delta: 0.02       # 突破价偏移≥2% → 算新事件
    reconfirm_cooldown_hours: 0   # "形态仍在"周期重推(0=关)
    max_repush_per_run: 6         # 单轮重推上限(防爆洪峰, 配PushLimiter)

  # === 新鲜度：硬截断 → 加权 (2026-09-10 P3) ===
  # 旧逻辑 age>窗口 直接砍(砍 65~70% 确认信号, 零推送主因之一)。
  # 改为加权：老突破不被砍死, 而是降权排后; 仅当"新鲜供给不足"时,
  # 用最强老突破做覆盖兜底(top-up), 文案标注"突破较旧"，不冒充新突破入场。
  #   freshness_mode=hard     → 退回旧逻辑(age>窗口即砍)
  #   freshness_mode=weighted → 降权+兜底(默认)
  freshness_mode: "weighted"
  freshness_topup_floor: 2        # 去重后剩余<此数时, 才允许填充最强老突破

# === 信号强度打分权重 ===
scoring:
  weights:
    completeness: 0.10             # 形态完整度（检测器二值门槛后的几何分）
    symmetry: 0.15                # 几何对称/结构质量（P2，借鉴 hunk77）
    breakout_magnitude: 0.20       # 突破幅度/ATR
    volume_confirmation: 0.15      # 成交量确认
    multi_tf_resonance: 0.15       # 多周期共振
    duration_reasonableness: 0.10  # 形态时长合理性
    trend_consistency: 0.10        # 与大趋势一致性
    proximity_to_target: 0.05      # 距目标位远近

  # 趋势一致性评分的 ADX 门槛（< 此值视为横盘，方向投票打折）
  adx_threshold: 20

  # 共振加分
  resonance_bonus:
    "1h_from_15m": 15
    "4h_from_15m": 10
    "4h_from_1h": 15
    "1d_from_1h": 10
    "1d_from_4h": 15
    smaller_lead: 8                # 更小周期领先确认

  # 矛盾惩罚
  conflict_penalty:
    "1h_vs_4h": -20
    "4h_vs_1d": -25
    "triple_conflict": -40

  # 分档
  threshold_strong: 75             # >= 强信号
  threshold_medium: 60             # 60~75 中等信号
  # < 60 仅记录不推送

# === 推送配置 ===
notification:
  # Webhook URL 从环境变量读取 (GitHub Secrets)
  webhook_url_env: "WECOM_WEBHOOK"

  # 企业微信限流保护 (硬限制20条/分钟, 我们留余量)
  push_rate_limit_per_minute: 18

  # 推送消息上显示的时间
  #
  # 【坑】GitHub Actions 的运行器是 UTC 时区，不指定时区的话推到群里
  # 会比你本地时间【慢 8 小时】，看着像"信号延迟推送"。这里显式指定北京时间。
  # 想看 UTC 就改成 "UTC"。
  # 注：Windows 本地若没装 tzdata 包，代码会自动退化成固定 UTC+8 偏移，不影响使用。
  timezone: "Asia/Shanghai"          # IANA 时区名
  time_format: "%Y-%m-%d %H:%M"      # 年月日 时分（秒可加 :%S）

  # 每次运行后发一条"扫描摘要"（确认服务存活；0 信号时也发，
  # 否则群里静悄悄的你以为挂了）。嫌吵就改 false。
  send_summary: true

  # 观察流独立 webhook (P0 治"乱")：观察样本推到单独的企微群机器人，
  # 与主信号群物理隔离，群里只剩达标信号。未配置时观察流暂停推送(不污染主群)，
  # 待在 GitHub Secrets 增加 WECOM_OBSERVE_WEBHOOK 后自动恢复。
  observe_webhook_url_env: "WECOM_OBSERVE_WEBHOOK"

  # 扫描摘要发送策略 (P0 治"乱")：
  #   always    → 每轮都发(旧行为, 噪声大)
  #   on_signal → 仅当有信号推送或本轮有异常时才发(默认, 群里安静)
  #   daily     → 每天只发一条(最安静, 但丢每轮反馈)
  summary_mode: "on_signal"

  # 图表渲染
  chart:
    width: 1100                     # 图表宽度(px) — 基准宽，实际按K线数自适应
    height: 525                     # 图表高度(px)
    dpi: 120                        # 渲染DPI
    # 显示的K线根数 — 按周期分别配置，与 kline_counts 对齐。
    # 图宽会按根数自适应（每根约2.2px），避免500根挤成一条实心带。
    candles_displayed:
      "15m": 600
      "1h": 400
      "4h": 300
      "1d": 240
    max_filesize_bytes: 1887436      # 图片大小上限(~1.8MB), 超过则降质
    compression_dpi: 80             # 降质时使用的DPI

  # 消息模板
  template:
    disclaimer: "仅供参考，不构成投资建议"
    emoji_long: "\U0001F4C8"        # 📈
    emoji_short: "\U0001F4C9"       # 📉

# === 日志配置 ===
logging:
  level: "INFO"                    # DEBUG / INFO / WARN / ERROR
  file: "output/scan_log.txt"       # 日志文件路径
  console: true                     # 同时输出到控制台
  # DEBUG 级别记录每个标的的扫描详情
  # INFO 级别记录候选/过滤/推送事件
  # WARN 记录限流/切换源/异常
  # ERROR 记录推送失败/致命错误

# === 输出产物 ===
output:
  dir: "output"                    # 输出目录
  signals_file: "signals.json"     # 信号JSON
  charts_dir: "charts"             # 图表子目录
  stats_file: "stats_summary.json" # 统计摘要
  retain_artifact_days: 7          # Actions artifact 保留天数

# === 状态持久化 ===
state:
  file: "state/state.json"         # 去重状态文件路径
  cache_key_prefix: "pattern-state-" # Actions cache key 前缀
  cleanup_days: 7                  # 过期信号清理窗口(天)
