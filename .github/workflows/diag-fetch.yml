name: Diag Fetch Case Klines

# 一次性诊断: 在 runner 上拉取指定标的 K 线并回传 artifact。
# 用途: 用户机器梯子未开, OKX 不通; runner 在 GitHub US IP 可直连 OKX。
# 触发后手动删除本文件 (或保留但仅 workflow_dispatch, 不影响 cron)。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch case klines
        run: |
          python - <<'EOF'
          import os, sys, csv
          sys.path.insert(0, "src")
          from market_data import OkxClient

          NEED = {"15m": 600, "1h": 400, "4h": 300, "1d": 240}
          cli = OkxClient()
          assert cli.ping(), "OKX ping fail"
          for sym, iv in [("CBRSUSDT", "1h"), ("ZBTUSDT", "4h"),
                          ("RKLBUSDT", "4h"), ("CBRSUSDT", "15m"),
                          ("ZBTUSDT", "15m"), ("CBRSUSDT", "4h")]:
              path = os.path.join("data", f"klines_{iv}", sym, f"{sym}.csv")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              try:
                  ks = cli.get_klines(sym, iv, limit=NEED[iv])
              except Exception as e:
                  print(f"  !! {sym} {iv} 异常: {e}")
                  continue
              print(f"  {sym} {iv}: {len(ks)}")
              with open(path, "w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f)
                  for k in ks:
                      w.writerow([k.openTime, k.open, k.high, k.low, k.close,
                                  k.volume, k.closeTime, k.quoteVolume])
          EOF

      - name: Upload klines
        uses: actions/upload-artifact@v4
        with:
          name: case-klines
          path: |
            data/klines_*/CBRSUSDT/*.csv
            data/klines_*/ZBTUSDT/*.csv
            data/klines_4h/RKLBUSDT/*.csv
          retention-days: 3
